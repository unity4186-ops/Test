<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Grid Game</title>
<style>
  :root {
    --bg: #faf8ef;
    --board: #bbada0;
    --cell: #cdc1b4;
    --text: #776e65;
    --text-light: #f9f6f2;
    --btn: #8f7a66;
    --gap: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1d1a17; --board: #4a4239; --cell: #5b5248; --text: #e8e2d9; --btn: #a08d78; }
  }
  :root[data-theme="dark"] { --bg: #1d1a17; --board: #4a4239; --cell: #5b5248; --text: #e8e2d9; --btn: #a08d78; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; touch-action: manipulation;
  }
  .wrap { width: 100%; max-width: 440px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 40px; margin: 0; letter-spacing: -1px; }
  .scores { display: flex; gap: 8px; }
  .score {
    background: var(--board); color: var(--text-light);
    border-radius: 6px; padding: 6px 14px; min-width: 84px; text-align: center;
    position: relative;
  }
  .score .label { font-size: 11px; text-transform: uppercase; opacity: .8; }
  .score .value { font-size: 22px; font-weight: 700; }
  .delta {
    position: absolute; left: 0; right: 0; top: 4px;
    font-size: 20px; font-weight: 700; color: var(--text);
    animation: rise .7s ease-out forwards; pointer-events: none;
  }
  @keyframes rise { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .hint { font-size: 13px; opacity: .8; }
  button {
    background: var(--btn); color: var(--text-light); border: 0; border-radius: 6px;
    padding: 9px 14px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  button + button { margin-left: 6px; }
  .board {
    position: relative; background: var(--board);
    border-radius: 8px; padding: var(--gap);
    aspect-ratio: 1 / 1; width: 100%; user-select: none;
  }
  .grid { position: absolute; inset: var(--gap); display: grid; gap: var(--gap);
          grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }
  .grid div { background: var(--cell); border-radius: 5px; }
  .tiles { position: absolute; inset: var(--gap); }
  .tile {
    position: absolute; display: flex; align-items: center; justify-content: center;
    border-radius: 5px; font-weight: 700; background: #eee4da; color: var(--text);
    transition: transform .1s ease-in-out;
    will-change: transform;
  }
  .tile.new { animation: pop .16s ease-in-out; }
  .tile.merged { animation: bump .16s ease-in-out; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes bump { 0% { transform: scale(1); } 50% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .v4 { background: #ede0c8; } .v8 { background: #f2b179; color: var(--text-light); }
  .v16 { background: #f59563; color: var(--text-light); } .v32 { background: #f67c5f; color: var(--text-light); }
  .v64 { background: #f65e3b; color: var(--text-light); } .v128 { background: #edcf72; color: var(--text-light); }
  .v256 { background: #edcc61; color: var(--text-light); } .v512 { background: #edc850; color: var(--text-light); }
  .v1024 { background: #edc53f; color: var(--text-light); } .v2048 { background: #edc22e; color: var(--text-light); }
  .vbig { background: #3c3a32; color: var(--text-light); }
  .overlay {
    position: absolute; inset: 0; border-radius: 8px;
    background: rgba(238, 228, 218, .78); display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center; z-index: 5;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .overlay { background: rgba(29, 26, 23, .82); } }
  :root[data-theme="dark"] .overlay { background: rgba(29, 26, 23, .82); }
  .overlay.show { display: flex; }
  .overlay p { font-size: 32px; font-weight: 700; margin: 0; }
  .icon { width: 20px; height: 20px; display: block; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 12px;
  }
  .icon-btn .icon { width: 18px; height: 18px; }
  .icon-only { padding: 9px; }
  .modal {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; background: rgba(0,0,0,.45); padding: 16px;
  }
  .modal.show { display: flex; }
  .panel {
    background: var(--bg); border-radius: 10px; padding: 20px; width: 100%; max-width: 340px;
    box-shadow: 0 12px 40px rgba(0,0,0,.3);
  }
  .panel h2 { margin: 0 0 16px; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .panel h2 .icon { width: 22px; height: 22px; }
  .row { display: flex; align-items: center; justify-content: space-between;
         gap: 12px; padding: 10px 0; border-top: 1px solid rgba(128,128,128,.25); }
  .row:first-of-type { border-top: 0; }
  .row label { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--btn); }
  .panel .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .danger { background: #c0563f; }
  body.no-anim .tile { transition: none !important; animation: none !important; }
  footer { margin-top: 14px; font-size: 13px; opacity: .75; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score"><div class="label">점수</div><div class="value" id="score">0</div></div>
      <div class="score"><div class="label">최고</div><div class="value" id="best">0</div></div>
    </div>
  </header>

  <div class="bar">
    <div class="hint">방향키 · WASD · 스와이프</div>
    <div>
      <button id="settings" class="icon-btn icon-only" title="설정" aria-label="설정">
        <svg class="icon"><use href="#i-settings"></use></svg>
      </button>
      <button id="undo" class="icon-btn" title="되돌리기 (Ctrl+Z)" disabled>
        <svg class="icon"><use href="#i-undo"></use></svg>되돌리기
      </button>
      <button id="new" class="icon-btn" title="새 게임">
        <svg class="icon"><use href="#i-restart"></use></svg>새 게임
      </button>
    </div>
  </div>

  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <p id="overlay-msg"></p>
      <div>
        <button id="overlay-continue" class="icon-btn" hidden>
          <svg class="icon"><use href="#i-play"></use></svg>계속하기
        </button>
        <button id="overlay-new" class="icon-btn">
          <svg class="icon"><use href="#i-restart"></use></svg>새 게임
        </button>
      </div>
    </div>
  </div>

  <footer>같은 숫자 타일을 밀어 합치세요. 2048을 만들면 승리하며, 이후에도 계속 진행할 수 있습니다.</footer>
</div>

<div class="modal" id="settings-modal">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <h2 id="settings-title"><svg class="icon"><use href="#i-sliders"></use></svg>설정</h2>
    <div class="row">
      <label for="opt-anim"><svg class="icon"><use href="#i-bolt"></use></svg>애니메이션</label>
      <input type="checkbox" id="opt-anim" checked>
    </div>
    <div class="row">
      <label for="opt-theme"><svg class="icon"><use href="#i-theme"></use></svg>다크 모드</label>
      <input type="checkbox" id="opt-theme">
    </div>
    <div class="row">
      <label><svg class="icon"><use href="#i-trophy"></use></svg>최고 점수</label>
      <button id="reset-best" class="icon-btn danger">
        <svg class="icon"><use href="#i-trash"></use></svg>초기화
      </button>
    </div>
    <div class="actions">
      <button id="settings-close" class="icon-btn">
        <svg class="icon"><use href="#i-confirm"></use></svg>확인
      </button>
    </div>
  </div>
</div>

<script src="assets/icons.js"></script>
<script>
(() => {
  "use strict";
  const SIZE = 4, WIN = 2048, KEY = "gridgame.best";

  const $ = (id) => document.getElementById(id);
  const gridEl = $("grid"), tilesEl = $("tiles"), boardEl = $("board");
  const scoreEl = $("score"), bestEl = $("best");
  const overlay = $("overlay"), overlayMsg = $("overlay-msg"), continueBtn = $("overlay-continue");
  const undoBtn = $("undo");

  for (let i = 0; i < SIZE * SIZE; i++) gridEl.appendChild(document.createElement("div"));

  let board, score, best = load(), won, over, history = null, uid = 0;
  const tileNodes = new Map();   // id -> element

  function load() {
    try { return Number(localStorage.getItem(KEY)) || 0; } catch { return 0; }
  }
  function saveBest() {
    try { localStorage.setItem(KEY, String(best)); } catch { /* private mode */ }
  }

  const empty = () => Array.from({ length: SIZE }, () => Array(SIZE).fill(null));

  function spawn() {
    const free = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!board[r][c]) free.push([r, c]);
    if (!free.length) return;
    const [r, c] = free[Math.floor(Math.random() * free.length)];
    board[r][c] = { id: ++uid, value: Math.random() < 0.9 ? 2 : 4, isNew: true, merged: false };
  }

  function reset() {
    board = empty(); score = 0; won = false; over = false; history = null;
    tilesEl.innerHTML = ""; tileNodes.clear();
    spawn(); spawn();
    overlay.classList.remove("show");
    undoBtn.disabled = true;
    render();
  }

  function snapshot() {
    return {
      score,
      won,
      board: board.map((row) => row.map((t) => (t ? { id: t.id, value: t.value } : null)))
    };
  }

  function undo() {
    if (!history) return;
    board = history.board.map((row) => row.map((t) => (t ? { ...t, isNew: false, merged: false } : null)));
    score = history.score; won = history.won; over = false;
    history = null; undoBtn.disabled = true;
    overlay.classList.remove("show");
    render();
  }

  // Slide one line (array of tiles/nulls) toward index 0. Returns {line, gained, moved}.
  function collapse(line) {
    const kept = line.filter(Boolean);
    const out = [];
    let gained = 0;
    for (let i = 0; i < kept.length; i++) {
      const t = kept[i];
      if (i + 1 < kept.length && kept[i + 1].value === t.value) {
        const value = t.value * 2;
        out.push({ id: t.id, value, isNew: false, merged: true });
        gained += value;
        i++;
      } else {
        out.push({ ...t, isNew: false, merged: false });
      }
    }
    while (out.length < SIZE) out.push(null);
    const moved = out.some((t, i) => (t ? t.id : null) !== (line[i] ? line[i].id : null) ||
                                     (t ? t.value : 0) !== (line[i] ? line[i].value : 0));
    return { line: out, gained, moved };
  }

  // dir: 0=left 1=up 2=right 3=down
  function read(dir, i) {
    const line = [];
    for (let j = 0; j < SIZE; j++) line.push(cell(dir, i, j));
    return line;
  }
  function cell(dir, i, j) {
    if (dir === 0) return board[i][j];
    if (dir === 2) return board[i][SIZE - 1 - j];
    if (dir === 1) return board[j][i];
    return board[SIZE - 1 - j][i];
  }
  function put(dir, i, j, v) {
    if (dir === 0) board[i][j] = v;
    else if (dir === 2) board[i][SIZE - 1 - j] = v;
    else if (dir === 1) board[j][i] = v;
    else board[SIZE - 1 - j][i] = v;
  }

  function move(dir) {
    if (over) return;
    const prev = snapshot();
    let moved = false, gained = 0;
    for (let i = 0; i < SIZE; i++) {
      const res = collapse(read(dir, i));
      if (res.moved) moved = true;
      gained += res.gained;
      for (let j = 0; j < SIZE; j++) put(dir, i, j, res.line[j]);
    }
    if (!moved) return;

    history = prev;
    undoBtn.disabled = false;
    if (gained) {
      score += gained;
      showDelta(gained);
      if (score > best) { best = score; saveBest(); }
    }
    spawn();
    render();

    if (!won && flat().some((t) => t.value >= WIN)) {
      won = true;
      finish("2048 달성!", true);
    } else if (!canMove()) {
      over = true;
      finish("게임 오버", false);
    }
  }

  const flat = () => board.flat().filter(Boolean);

  function canMove() {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const t = board[r][c];
      if (!t) return true;
      if (c + 1 < SIZE && board[r][c + 1] && board[r][c + 1].value === t.value) return true;
      if (r + 1 < SIZE && board[r + 1][c] && board[r + 1][c].value === t.value) return true;
    }
    return false;
  }

  function finish(msg, keepPlaying) {
    overlayMsg.textContent = msg;
    continueBtn.hidden = !keepPlaying;
    overlay.classList.add("show");
  }

  function showDelta(gained) {
    const el = document.createElement("div");
    el.className = "delta";
    el.textContent = "+" + gained;
    scoreEl.parentElement.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }

  function valueClass(v) { return v > 2048 ? "vbig" : "v" + v; }

  function render() {
    scoreEl.textContent = score;
    bestEl.textContent = best;

    const inner = tilesEl.clientWidth;
    const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gap"));
    const size = (inner - gap * (SIZE - 1)) / SIZE;
    const seen = new Set();

    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const t = board[r][c];
      if (!t) continue;
      seen.add(t.id);
      let el = tileNodes.get(t.id);
      if (!el) {
        el = document.createElement("div");
        tilesEl.appendChild(el);
        tileNodes.set(t.id, el);
      }
      el.className = "tile " + valueClass(t.value) + (t.isNew ? " new" : "") + (t.merged ? " merged" : "");
      el.textContent = t.value;
      el.style.width = el.style.height = size + "px";
      el.style.fontSize = Math.round(size * (String(t.value).length > 3 ? 0.30 : 0.42)) + "px";
      el.style.transform = `translate(${c * (size + gap)}px, ${r * (size + gap)}px)`;
      t.isNew = false; t.merged = false;
    }

    for (const [id, el] of tileNodes) {
      if (!seen.has(id)) { el.remove(); tileNodes.delete(id); }
    }
  }

  const KEYS = {
    ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3,
    a: 0, w: 1, d: 2, s: 3, A: 0, W: 1, D: 2, S: 3
  };
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { modal.classList.remove("show"); return; }
    if (modal.classList.contains("show")) return;
    if (e.key === "z" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); return; }
    const dir = KEYS[e.key];
    if (dir === undefined) return;
    e.preventDefault();
    move(dir);
  });

  let start = null;
  boardEl.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    start = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  boardEl.addEventListener("touchend", (e) => {
    if (!start) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - start.x, dy = t.clientY - start.y;
    start = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 2 : 0) : (dy > 0 ? 3 : 1));
  }, { passive: true });

  // ── 설정 ──────────────────────────────────────────
  const OPTS = "gridgame.opts";
  const modal = $("settings-modal"), optAnim = $("opt-anim"), optTheme = $("opt-theme");
  let opts = { anim: true, theme: null };
  try { opts = { ...opts, ...JSON.parse(localStorage.getItem(OPTS) || "{}") }; } catch { /* ignore */ }

  function applyOpts() {
    document.body.classList.toggle("no-anim", !opts.anim);
    if (opts.theme) document.documentElement.dataset.theme = opts.theme;
    else delete document.documentElement.dataset.theme;
    optAnim.checked = opts.anim;
    optTheme.checked = opts.theme
      ? opts.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    try { localStorage.setItem(OPTS, JSON.stringify(opts)); } catch { /* private mode */ }
  }

  optAnim.addEventListener("change", () => { opts.anim = optAnim.checked; applyOpts(); });
  optTheme.addEventListener("change", () => { opts.theme = optTheme.checked ? "dark" : "light"; applyOpts(); });
  $("reset-best").addEventListener("click", () => { best = 0; saveBest(); render(); });
  $("settings").addEventListener("click", () => modal.classList.add("show"));
  $("settings-close").addEventListener("click", () => modal.classList.remove("show"));
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("show"); });

  $("new").addEventListener("click", reset);
  $("overlay-new").addEventListener("click", reset);
  undoBtn.addEventListener("click", undo);
  continueBtn.addEventListener("click", () => overlay.classList.remove("show"));
  window.addEventListener("resize", render);

  applyOpts();
  reset();
})();
</script>
</body>
</html>
